<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login - V1</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5" style="max-width: 400px;">
    <div class="card shadow">
        <div class="card-body p-4">
            <h4 class="mb-3 text-danger">Login <small class="text-muted fs-6">(v1 - inseguro)</small></h4>

            {% if error %}
            <!-- VULNERABILIDAD: se muestra la query SQL al usuario
                 (info disclosure) y se renderiza con |safe →
                 Reflected XSS si el username contiene <script>. -->
            <div class="alert alert-danger small">{{ error | safe }}</div>
            {% endif %}

            <!-- VULNERABILIDAD: CSRF - formulario sin token anti-CSRF -->
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">Usuario</label>
                    <input type="text" name="username" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Contraseña</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-danger w-100">Ingresar</button>
            </form>
            <hr>
            <a href="/register" class="text-decoration-none">¿No tienes cuenta? Regístrate</a>
        </div>
    </div>
</div>
</body>
</html>
