<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Server Status - V1</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5" style="max-width: 700px;">
    <div class="card shadow">
        <div class="card-body p-4">
            <h4 class="mb-3 text-danger">Diagnóstico del servidor
                <small class="text-muted fs-6">(v1 - inseguro)</small>
            </h4>
            <p class="text-muted small">
                Herramienta de administración que ejecuta comandos en el servidor.
                <!-- VULNERABILIDAD: no hay validación del comando (RCE) -->
            </p>

            <form method="POST">
                <div class="input-group mb-3">
                    <input type="text" name="command" class="form-control"
                           placeholder="Ej: whoami  |  cat /etc/passwd  |  id"
                           value="{{ command }}">
                    <button type="submit" class="btn btn-danger">Ejecutar</button>
                </div>
            </form>

            {% if output %}
            <div class="card bg-dark text-light">
                <div class="card-header">Salida del comando</div>
                <div class="card-body">
                    <pre class="mb-0"><code>{{ output }}</code></pre>
                </div>
            </div>
            {% endif %}

            <hr>
            <a href="/logout" class="btn btn-outline-secondary btn-sm">Cerrar sesión</a>
            <a href="/dashboard" class="btn btn-outline-primary btn-sm">Ir al dashboard</a>
        </div>
    </div>
</div>
</body>
</html>
