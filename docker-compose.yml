services:
  v1-insecure:
    build: ./v1-insecure
    ports:
      - "5000:5000"
    container_name: seg-v1-insecure

  v2-secure:
    build: ./v2-secure
    ports:
      - "8443:8443"
    environment:
      - SECRET_KEY=clave-segura-generada-para-demo
    container_name: seg-v2-secure

  unificada:
    build: ./unificada
    ports:
      - "5002:5002"
    environment:
      - SECRET_KEY=clave-demo-unificada
    container_name: seg-unificada
